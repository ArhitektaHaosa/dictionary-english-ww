# dictionary-english-ww — paste these locations into the EXISTING CloudPanel vhost.
# Put them immediately after the {{settings}} line.
#
# Do not replace the whole vhost with this file.
# Do not add a second "location /".
# CloudPanel's PHP vhost already contains:
#   try_files $uri $uri/ /index.php?$args;
# A second location / makes nginx refuse the reload (duplicate location "/")
# and the site stays down or returns 502.
#
# Required CloudPanel setting: Sites > Settings > Root Directory = public
# With that set, /dictionary/english/{word} is already handled by the line above.
#
# If your vhost has no try_files line at all, do not use this snippet.
# Paste deploy/cloudpanel-vhost.conf over the vhost instead. That file keeps
# every CloudPanel placeholder ({{root}}, {{php_fpm_port}}, {{ssl_certificate}}).

location ^~ /data/ {
    deny all;
    return 404;
}

location ~* ^/(?:config\.php|src/|tools/|deploy/) {
    deny all;
    return 404;
}
